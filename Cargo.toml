[package]
name = "weft-web"
version = "0.1.0"
edition = "2024"
description = "weft in a browser: runs weft sessions in pseudo-terminals and serves them to a phone over Tailscale, and to a terminal on the Mac."

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.10.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
jiff = "0.2.38"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "signal"] }
tokio-tungstenite = "0.30.0"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
debug = false
